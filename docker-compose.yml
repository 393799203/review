services:
  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      # 前端在本地构建(vite build),dist 直接挂载进 nginx,服务器无需构建前端镜像
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - stock-network
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      # 密码默认值与下方 db 服务 POSTGRES_PASSWORD 保持一致；
      # .env 中若配置 DB_PASSWORD 则优先使用（两台服务器当前均为 stock2024）
      - DATABASE_URL=postgresql://stock_user:${DB_PASSWORD:-stock2024}@db:5432/stock_review
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=stock_review
      - DB_USER=stock_user
      - DB_PASSWORD=${DB_PASSWORD:-stock2024}
      - FLASK_ENV=production
      - TZ=Asia/Shanghai
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - WEIXIN_APP_ID=${WEIXIN_APP_ID}
      - WEIXIN_APP_SECRET=${WEIXIN_APP_SECRET}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_API_URL=${DEEPSEEK_API_URL:-https://api.deepseek.com/v1/chat/completions}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - DEEPSEEK_MODELS=${DEEPSEEK_MODELS:-deepseek-chat}
      - DEEPSEEK_TEMPERATURE=0.7
      - DEEPSEEK_MAX_TOKENS_SHORT=500
      - DEEPSEEK_MAX_TOKENS_MEDIUM=1000
      - DEEPSEEK_MAX_TOKENS_LONG=4000
      # AI 后备通道（SenseNova）：主通道 DeepSeek 失败/欠费时自动切换，模型名沿用 DEEPSEEK_MODEL
      - LLM_FALLBACK_API_URL=${LLM_FALLBACK_API_URL:-https://token.sensenova.cn/v1/chat/completions}
      - LLM_FALLBACK_API_KEY=${LLM_FALLBACK_API_KEY}
      # 量化筛选行情库（tdx_daily 同步的 quantdb），未配置时筛选返回 503 提示
      - TDX_DATABASE_URL=${TDX_DATABASE_URL}
      - FASTEMBED_CACHE_PATH=/root/.cache/fastembed
    depends_on:
      db:
        condition: service_healthy
    networks:
      - stock-network
    restart: always
    volumes:
      - backend-logs:/app/logs
      - ./embed-cache:/root/.cache/fastembed

  db:
    image: postgres:15-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=stock_review
      - POSTGRES_USER=stock_user
      - POSTGRES_PASSWORD=stock2024
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - stock-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_user -d stock_review"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  stock-network:
    driver: bridge

volumes:
  postgres-data:
  backend-logs:
